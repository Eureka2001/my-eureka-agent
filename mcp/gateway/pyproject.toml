[project]
name = "eureka-gateway"
version = "0.1.0"
description = "eureka MCP 网关：聚合本地 MCP server 为单入口，后端按需 spawn、空闲回收。"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["backends.py", "manifest.py", "proxy.py", "server.py"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.12,<1",
]
