[project]
name = "eureka-vision"
version = "0.1.0"
description = "视觉理解 MCP server。"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["server.py"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "ruff>=0.12,<1",
]
