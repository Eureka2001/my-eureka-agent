[project]
name = "eureka-qrcode"
version = "0.1.0"
description = "本地 QR/条形码解码 MCP server（pyzbar → wechat-qrcode fallback），确定性、离线。"
requires-python = ">=3.10"
# 以 `uv run server.py` 方式运行，无需打包；依赖固定 mcp 1.x（避开 2.0 RC）。
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
    "pyzbar>=0.1.9",
    "opencv-contrib-python>=4.10",
]
